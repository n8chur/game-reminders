name: PR metadata

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate-ai-disclosure:
    name: Validate AI disclosure
    runs-on: ubuntu-latest

    steps:
      - name: Validate attribution
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(({ name }) => name);
            if (!labels.includes('AI Generated')) {
              core.info('PR is not labeled AI Generated; no attribution is required.');
              return;
            }

            const body = context.payload.pull_request.body ?? '';
            const required = "> Implemented by OpenAI Codex under @n8chur's direction.";
            const hasRequiredLine = body
              .split(/\r?\n/)
              .some((line) => line === required);

            if (!hasRequiredLine) {
              core.setFailed(`AI Generated PRs must include this exact line: ${required}`);
              return;
            }

            if (/\bWestin(?:\s+Newell)?\b/i.test(body)) {
              core.setFailed('Refer to the repository owner only as @n8chur in PR descriptions.');
            }
