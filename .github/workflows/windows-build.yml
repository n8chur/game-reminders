name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate Shortcut source
        shell: pwsh
        run: ./shortcuts/Test-ShortcutSource.ps1

      - name: Validate generated Shortcut artifact
        shell: pwsh
        run: ./shortcuts/Test-ShortcutArtifact.ps1 -Path './shortcuts/GameReminder-unsigned.shortcut'

      - name: Validate portable Shortcut prototype
        shell: pwsh
        run: >-
          ./shortcuts/Test-PortableShortcutArtifact.ps1
          -Path './shortcuts/prototypes/portable/GameReminder-portable-unsigned.shortcut'
          -CanonicalPath './shortcuts/GameReminder-unsigned.shortcut'

      - name: Restore
        run: dotnet restore GameReminders.slnx

      - name: Test
        run: dotnet test GameReminders.slnx --configuration Release --no-restore

      - name: Publish portable Windows build
        run: >-
          dotnet publish src/GameReminders.App/GameReminders.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/game-reminders-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-reminders-win-x64
          path: artifacts/game-reminders-win-x64/
          if-no-files-found: error
          retention-days: 14
